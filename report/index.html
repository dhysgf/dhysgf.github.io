<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>跳转中 · stockpred 报告</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#1f2328;
 font:15px/1.75 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:56px 20px}
.card{background:#fff;border:1px solid #dfe3e8;border-radius:12px;padding:22px 24px}
.muted{color:#6b7280;font-size:13.5px;line-height:1.7}
code{background:#f6f8fa;padding:1px 5px;border-radius:4px;font:12.5px ui-monospace,Consolas,monospace}
.err{background:#fef2f2;border-left:4px solid #dc2626;padding:12px 16px;border-radius:6px;margin:12px 0}
.warn{background:#fffbeb;border-left:4px solid #f59e0b;padding:12px 16px;border-radius:6px;margin:12px 0;font-size:13.5px}
a{color:#2563eb}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 style="font-size:20px;margin:0 0 8px" id="h">正在跳转…</h1>
    <div class="muted" id="tip">正在按 code 参数定位报告。</div>
    <div id="extra"></div>
    <p class="muted" style="margin-top:14px"><a href="../stockpred/">进入项目首页 →</a></p>
  </div>
</div>
<script>
/* 兼容本地版 web.py 的链接形态：/report?code=600519&refresh=1
   静态托管没有后端，refresh=1（重新训练）无法执行——
   这里只把 code 带到项目站，由项目站决定打开报告还是分析页。 */
(function () {
  var q = new URLSearchParams(location.search);
  var m = String(q.get("code") || "").match(/\d{6}/);
  var code = m ? m[0] : "";
  var refresh = q.get("refresh") === "1";
  var h = document.getElementById("h");
  var tip = document.getElementById("tip");

  if (!code) {
    h.textContent = "缺少 code 参数";
    tip.innerHTML = "用法：<code>/report?code=600519</code>（code 为 6 位 A 股代码）。" +
      "也可以直接用项目站：<code>/stockpred/?code=600519</code>";
    return;
  }

  if (refresh) {
    document.getElementById("extra").innerHTML =
      '<div class="warn">链接带了 <code>refresh=1</code>（本地版表示“重新训练”）。' +
      'GitHub Pages 是静态托管，<b>无法重新训练模型</b>，这里只能打开已固化的快照报告；' +
      '要真正刷新数值请在本地运行 <code>python make_report.py --symbol ' + code + ' --run</code>。</div>';
  }

  var target = "../stockpred/?code=" + code + (refresh ? "&refresh=1" : "");
  tip.innerHTML = "正在打开 <code>" + code + "</code>…";
  setTimeout(function () { location.replace(target); }, refresh ? 2200 : 0);
})();
</script>
</body>
</html>
