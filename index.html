<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>跳转中 · stockpred</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#1f2328;
 font:15px/1.75 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:64px 20px}
.card{background:#fff;border:1px solid #dfe3e8;border-radius:12px;padding:22px 24px}
.muted{color:#6b7280;font-size:13.5px}
code{background:#f6f8fa;padding:1px 5px;border-radius:4px;font:12.5px ui-monospace,Consolas,monospace}
.err{background:#fef2f2;border-left:4px solid #dc2626;padding:12px 16px;border-radius:6px;margin:12px 0}
a{color:#2563eb}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 style="font-size:20px;margin:0 0 8px">正在跳转…</h1>
    <p class="muted" id="tip">正在打开 A 股多模型决策系统的报告页。</p>
    <p class="muted"><a id="manual" href="./stockpred/">如果没有自动跳转，点这里</a></p>
  </div>
</div>
<script>
/* 用户站点根 → 项目站。本项目源码与演示站在 /stockpred/ 下，
   这里只做一次跳转，避免旧链接直接 404。 */
(function () {
  var target = "./stockpred/";
  document.getElementById("manual").setAttribute("href", target);
  location.replace(target);
})();
</script>
</body>
</html>
